name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
        redeploy_only:
            description: 'skip build, redeploy last image'
            type: boolean
            default: false

env:
    IMAGE_NAME: orderservice
    REGISTRY: ghcr.io/ljprr


jobs:
    format-test:
      if: ${{ !inputs.redeploy_only}} #negation for single val in ctxt 
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-dotnet@v4
            with:
                  dotnet-version: '8.0.x'
          - uses: actions/cache@v4
            with:
                 path: ~/.nuget/packages
                 key: nuget-${{ hashFiles('**/*.csproj')}}
          - run: cd OSV
          - run: dotnet format --verify-no-changes
          - run: dotnet build -c Release
          - run: dotnet test
          - run: dotnet list package --vulnerable --include-transitive

    docker-build-scan:
        if: ${{ !inputs.redeploy_only}}
        needs: format-test #enforcement/gate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/build-push-action@v6
              with:
                    context: .
                    tags: ${{env.IMAGE_NAME}}:${{ github.sha }} ##nb github.sha context not env
                    load: true
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
            - uses: aquasecurity/trivy-action@master
              with:
                    image-ref: '${{env.IMAGE_NAME}}:${{ github.sha }}'
                    severity: 'HIGH,CRITICAL'
                    ignore-unfixed: true
                    exit-code: '1'
    push: 
      needs: docker-build-scan   ### gate/enforcement
      if: github.ref == 'refs/heads/main' && !inputs.redeploy_only
      runs-on: ubuntu-latest
      steps: 
        - uses: actions/checkout@v4
        # auth to registry
        - run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        # build in curr loc
        - run: docker build -t $REGISTRY/$IMAGE_NAME:$GITHUB_SHA . 
        # send build to registry 
        - run: docker push $REGISTRY/IMAGE_NAME:$GITHUB_SHA

    deploy:
      needs: push #enforcement
      # if :thumbsup: and either triggered by main or workflow
      if: always() && (github.ref == 'refs/heads/main' || inputs.redeploy_only) 
      runs-on: ubuntu-latest
      steps: 
        #from reg
        - run: docker pull $REGISTRY/$IMAGE_NAME:$GITHUB_SHA
        # kill it or already killt
        - run: docker stop orderservice-prod 2>/dev/null; docker rm orderservice-prod 2>/dev/null || true

